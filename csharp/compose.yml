# The port beside its own SQL Server, end to end on synthetic rows:
#   MSSQL_PASSWORD='<a strong password>' docker compose -f csharp/compose.yml up --build --exit-code-from forecasthost
# SQL Server starts empty; the port seeds the demo database (ForecastHost/Demo.cs),
# runs once and exits, and compose then stops SQL Server. No port is published, so
# this does not clash with a SQL Server already on localhost:1433.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD:?set MSSQL_PASSWORD}
      MSSQL_PID: Developer
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  forecasthost:
    build: .
    environment:
      MSSQL_HOST: sqlserver
      MSSQL_PASSWORD: ${MSSQL_PASSWORD:?set MSSQL_PASSWORD}
    command: ["--seed-demo"]
    depends_on:
      sqlserver:
        condition: service_healthy
